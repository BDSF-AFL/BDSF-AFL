# BDSF-AFL Hardened Matrix: Baseline Benchmark Experiment Manifest
experiment:
  name: "hardened_baseline_benchmarks"
  dataset: "CIFAR10"
  model_architecture: "resnet18"
  rounds: 200
  batch_size: 32
  local_epochs: 1
  lr: 0.01
  local_lr: 0.01
  lr_schedule: "cosine"
  lr_min: 0.001
  fedprox_mu: 0.01
  N_clients: 20
  M: 30
  K_base: 50
  K_ref: 10
  eta: 0.01
  server_momentum: 0.90
  theta_self: 0.30
  theta_self_mature: 0.30
  theta_floor: 0.40
  theta_anchor_min: 0.25
  theta_anchor_mature: 0.25
  theta_cos: 0.15
  adaptive_clip_enabled: true
  gamma_clip: 1.10
  theta_prc: 0.20
  theta_prc_hard: -0.10
  prc_buffer_k: 10
  theta_tra: 0.45
  suspicion_decay: 0.50
  suspicion_step: 0.15
  suspicion_reject_thresh: 0.65
  static_clip_C: 10.0
  warmup_rounds: 300
  spatial_warmup_rounds: 300
  temporal_min_samples: 300
  norm_anomaly_threshold: 1.60
  trs_reject_thresh: 0.85
  trs_warn_thresh: 0.80
  trs_safe_thresh: 0.70
  trs_min_depth: 5
  alpha_I: 0.20
  alpha_P: 0.15
  beta_I: 0.08
  beta_P: 0.10
  spatial_grace_k: 3
  enable_quarantine: true
  quarantine_horizon: 5
  quarantine_capacity: 20
  delta_borderline: 0.05
  K_drift_max: 10
  min_integrity_floor: 0.10

  algorithms:
    - "Proposed_BDSF_AFL"

  heterogeneity:
    - alpha: 0.5
      label: "Moderate_NonIID"

  attacks:
    - "S2_MIMICRY"

  byzantine_fractions:
    - 0.2

  seeds:
    - 42

  target_accuracy: 0.75
  early_stopping: true
  min_early_stop_round: 100
  early_stopping_patience: 5
  log_dir: "logs/hardened_matrix/benchmarks/"
  checkpoint_dir: "logs/hardened_matrix/checkpoints/"
  summary_path: "logs/hardened_matrix/summaries/benchmark_summary.csv"
