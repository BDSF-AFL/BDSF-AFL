# BDSF-AFL Full Configuration

# System
N_clients: 20
total_rounds: 500
eval_every: 10
log_dir: "logs/"
device: "cpu"

# Dataset
dataset: "CIFAR10"       # MNIST | CIFAR10 | FEMNIST
dirichlet_alpha: 0.1     # 0.1=heterogeneous | 0.5=moderate | .inf=IID
batch_size: 32

# Client training
local_epochs: 1              # single-epoch local steps to minimize non-IID client drift
local_lr: 0.01
lr_schedule: "cosine"        # dynamic learning rate: cosine annealing from 0.01 -> 0.001
lr_min: 0.001
T_base: 1.0                  # base compute time (seconds; simulated)
lognormal_mu: 0.5
lognormal_sigma: 1.0
fedprox_mu: 0.01             # proximal regularization to bound non-IID trajectory deviation

# Server aggregation & Optimization (Phase 5)
eta: 0.01                   # calibrated server learning rate for asynchronous aggregation
server_momentum: 0.90       # Momentum-enhanced asynchronous aggregation (FedAvgM beta_m=0.90)
model_architecture: "resnet18"       # resnet18 (CIFAR-10 Adapted) | cnn (Legacy baseline) | mlp (MNIST)
early_stopping: false                # Automated convergence stopping
early_stopping_patience: 10          # Consecutive evaluations without gain before early stopping (10 evals = 100 rounds)
min_early_stop_round: 100            # Never trigger early stopping before Round 100
checkpoint_every: 5                  # Checkpoint frequency (evaluations)
resume: false                        # Resume from saved checkpoint

# Temporal filter (Pillar 1)
K_base: 50
lam: 0.3                 # lambda — volatility sensitivity
kappa: 1.5               # Tukey fence multiplier; sweep {1.0, 1.5, 2.0, 2.5}
use_tukey: true          # ablation: false = raw Q1/Q3
fixed_K: false           # ablation: true = disable adaptive K_t

# Spatial validator (Pillar 3)
K_ref: 10
M: 30
theta_cos: 0.15             # calibrated Priority 2 consensus threshold for ResNet-18
theta_self: 0.30        # calibrated identity threshold for ResNet-18 non-IID manifolds
theta_self_mature: 0.30 # calibrated identity threshold for mature clients
theta_floor: 0.40       # calibrated directional floor for ResNet-18 Non-IID Dirichlet skew
theta_anchor_min: 0.25  # calibrated anchor threshold tracking loss surface gradient rotation
theta_anchor_mature: 0.25 # robust genesis anchor alignment for mature clients
gamma_clip: 1.10             # strictly clips excess orthogonal perturbation energy
top_k_ref: true          # always topk reference
adaptive_clip_enabled: true  # dynamic adaptive norm clipping
static_clip_C: 10.0      # safe ceiling for ResNet-18 on CIFAR-10
warmup_rounds: 200       # 200 updates (10 rounds across 20 clients) for clean dossier construction
spatial_warmup_rounds: 200 # synchronized with warmup_rounds
norm_anomaly_threshold: 1.60 # logged diagnostic threshold (not a rejection gate)

# Layer-Stratified Subspace Projection Engine (BDSF-AFL v2)
enable_subspace: true
subspace_K: 10
subspace_macro_floor: 0.40
subspace_c_min_floor: 0.30
subspace_eps_floor: 0.05
subspace_alpha: 0.60
subspace_lam: 3.0
subspace_beta: 0.85
subspace_kappa: 0.10
subspace_m_perp_base: 2.0
subspace_mu_floor: 0.10          # macro consensus alignment floor
subspace_energy_floor: 0.40      # minimum fraction of energy in consensus manifold (rho_parallel)

# Boundary-Pinning Rejection Gate (S2 Mimicry & Adaptive Detection, Priority 1c)
# Runs on the RAW cosine (before subspace damping) and only on the client's in-band samples, so
# COMPOUND's interleaved T1 noise cannot dilute it. S2's raw cosine variance is ~1e-12; honest
# clients hovering in the band show ~1e-3. ADAPTIVE (0.9 safety backoff + jitter) is noisier, so the
# threshold is looser and the window longer than before. CALIBRATE bisection_variance_thresh on the
# in-band raw-cosine variance of honest clients in your own logs (column sim_global_raw).
bisection_window: 6              # number of in-band raw-cosine samples required
bisection_variance_thresh: 0.0001 # variance <= 1e-4 over that window => boundary pinning
bisection_band_margin: 0.10      # boundary band: [theta_cos - 0.02, theta_cos + margin]
exempt_use_raw_sim: true         # consensus-exemption (TRS bypass) uses raw cosine, not subspace-damped
stochastic_jitter_max: 0.04      # explicit now (was an undocumented code default); S2 targets theta_cos+0.05
subspace_damp_reject_floor: 0.02 # Gate-2 w_damp below this => spatial REJECT (T1 noise), 0 disables

# Boundary-steering detection v2 (S2 / ADAPTIVE) -- see decision_engine.py Priority 1c / 1d
# Mass point: if >= pin_mass_min earlier in-band raw cosines of this client sit within pin_mass_tol of
# the current one, it is steering to a fixed boundary value (S2 lands on theta_cos+0.05 to ~1e-6).
# Unlike the variance gate it survives interleaved unattacked dips, and fires after 3 samples, not 6.
pin_mass_tol: 0.0015
pin_mass_min: 3
# Probation: in-band submissions with a thin record (< pin_probation_min_samples in-band samples) or with
# mass-point / narrow-spread evidence are admitted at pin_probation_weight instead of full weight.
# Suspects are also kept out of the reference buffer and charged to the leaky rejection rate.
pin_probation_enabled: true
pin_probation_min_samples: 2
pin_probation_weight: 0.15
pin_suspect_nn: 0.008      # suspect if 2nd-nearest earlier in-band sample is closer than this
pin_suspect_min_hits: 1
pin_strong_hits: 2         # strong suspects are also charged to the leaky rejection rate

# Honest-convergence certificate: manifold evidence (mu, rho_parallel) + coherent residuals + NO
# boundary-steering evidence => exempt from every TRS-driven branch (P2 gate, suspicion, P3 reject, P4).
# TRS measures client self-consistency, which genuinely converging non-IID clients have by construction.
honest_cert_enabled: true
cert_mu_min: 0.05
cert_rho_min: 0.40
cert_prc_min: 0.10
cert_tra_min: 0.30

# Async staleness weight = max(staleness_floor, (1 + version_lag) ** -staleness_exponent), applied to EVERY
# decision weight. Legacy = exponent 0.5, floor 0.0. With 20 clients cycling asynchronously the typical lag is
# ~15-20, i.e. a legacy factor of ~0.22-0.25 on honest and Byzantine updates alike, BEFORE any defence logic.
staleness_exponent: 0.5
staleness_floor: 0.0
# Relative staleness: discount only lag ABOVE the recent population median lag (typical-lag clients get 1.0).
# Absolute staleness at lag~16 is a uniform ~0.24 learning-rate cut that cannot tell honest from Byzantine.
staleness_relative: true
staleness_ref_window: 60
staleness_ref_min: 10

# P4 manifold boost: non-IID honest clients (sim_g < 0, so no certificate) that sit inside the consensus subspace
# (mu/rho_par/prc/tra above the cert_* floors), have no pinning evidence and suspicion < 0.30 are DOWNWEIGHTed at
# max(alpha_eff, p4_manifold_weight) instead of ~0.3. They still stay out of the accepted buffer / consensus basis.
p4_manifold_weight: 0.60

# Population-wide straggler shock: if >= this many OTHER distinct clients already violated the upper temporal fence
# within the last straggler_shock_window evaluations, the hard straggler guard is waived (0 = off).
straggler_shock_min_clients: 2
straggler_shock_window: 40

# Leaky rejection memory (reputation). Replaces "3 consecutive rejects" as the ONLY slash trigger,
# which COMPOUND (reject/accept alternation) bypassed forever.
rep_reject_ema_rho: 0.20         # EMA step for the per-client rejection rate
rep_reject_ema_slash: 0.40       # slash I whenever rejection-rate EMA >= this
rep_reject_ema_recover_block: 0.30 # withhold the +beta_I recovery while EMA >= this

# Trajectory Rigidity & Variance Behavioral Defense
trs_reject_thresh: 0.85  # TRS >= 0.85 + depth >= 5 -> REJECT + SLASH (proven rigid steering)
trs_warn_thresh: 0.80    # TRS in (0.70, 0.80] -> DOWNWEIGHT
trs_safe_thresh: 0.70    # TRS <= 0.70 -> clean full consensus acceptance
trs_min_depth: 5         # minimum history depth before active trajectory sentencing
trs_consensus_exempt: true
trs_consensus_margin: 0.10

# Pairwise Residual Coherence (PRC) & Temporal Residual Autocorrelation (TRA)
theta_prc: 0.20          # logged diagnostic PRC score
theta_prc_hard: -0.10    # logged hard bound
prc_buffer_k: 10         # cross-client residual buffer size for PRC computation
theta_tra: 0.45          # logged TRA score
suspicion_decay: 0.50    # exponential decay for fluid trajectories
suspicion_step: 0.15     # suspicion increment for rigid trajectory drift
suspicion_reject_thresh: 0.65 # threshold for soft rejection of persistent uncoordinated noise

# Reputation (Pillar 2)
alpha_I: 0.20            # softened integrity slash for rapid honest recovery
alpha_P: 0.15            # softened pace slash
beta_I: 0.08             # accelerated integrity recovery
beta_P: 0.10             # accelerated pace recovery
min_integrity_floor: 0.10 # bounded trust floor preventing permanent node death
# Constraint enforced in code: beta_I < beta_P, alpha_I >= alpha_P
spatial_grace_k: 3       # 3 consecutive rejections required before integrity slash
temporal_grace_k: 3    # straggler rejections allowed before P_i is slashed
borderline_margin: 0.10
borderline_limit: 5

# Joint Decision Engine & Multi-Action Filtering (Phase 3)
decision_mode: "joint"            # "joint" | "legacy"
warm_start_mode: "state_maturity" # "state_maturity" (Adaptive) | "fixed" (Legacy 80)
temporal_min_samples: 200         # 200 gap observations for mature empirical Tukey fences
behavioral_min_depth: 3           # Trajectory history depth for behavioral maturity
warmup_weight_factor: 0.5         # Weight attenuation for warmup contributions
alpha_downweight: 0.35            # Base weight attenuation for non-IID updates
K_drift_max: 10                   # Max consecutive downweights before threshold escalation
delta_theta_step: 0.05            # Self-threshold penalty step per consecutive downweight
delta_theta_max: 0.25             # Maximum total threshold penalty
delta_temp_mod: 0.50              # Moderate temporal anomaly margin fraction
enable_quarantine: true           # Enable bounded quarantine state machine
quarantine_horizon: 5             # Maximum rounds an update is held before expiry
quarantine_capacity: 20           # Maximum updates held in quarantine buffer
delta_borderline: 0.05            # Spatial margin around theta_cos for quarantine
trusted_integrity_min: 0.80       # Minimum integrity score I_i for moderate temporal quarantine

# Attack simulation
byz_fraction: 0.2        # 0.1 | 0.2 | 0.3; 0.5 for boundary test
attack_type: "COMPOUND"  # T1_HIGH_FREQ | T2_STRAGGLER | S1_POISON |
                         # S2_MIMICRY | ADAPTIVE | COMPOUND
